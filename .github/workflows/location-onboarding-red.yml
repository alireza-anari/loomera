name: Location onboarding RED

on:
  push:
    branches:
      - fix/onboarding-location-outside-tehran

permissions:
  contents: read

jobs:
  regression-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-secret-key-not-for-runtime
      DATABASE_URL: sqlite:///ci.sqlite3
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      ONLINE_PAYMENT_ENABLED: "False"
      MESSAGING_ENABLED: "False"
      MESSAGING_OUTBOUND_ENABLED: "False"
      BALE_BOT_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin libgdal-dev libgeos-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run nationwide onboarding location regression
        run: |
          python manage.py test apps.search.test_onboarding_location_outside_tehran --settings=loomera.settings.test --noinput -v 2
