name: Location optional area TDD

on:
  push:
    branches:
      - fix/onboarding-location-area-optional

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: "github.event.head_commit.message == 'ci: apply optional location area fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-only-secret-key-not-for-runtime
      DATABASE_URL: sqlite:///ci.sqlite3
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      ONLINE_PAYMENT_ENABLED: "False"
      MESSAGING_ENABLED: "False"
      MESSAGING_OUTBOUND_ENABLED: "False"
      BALE_BOT_ENABLED: "False"
      SPATIALITE_LIBRARY_PATH: mod_spatialite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply optional-area production fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/dashboards/views.py",
              '''    return bool(\n        salon.zone\n        and salon.neighborhood_id\n        and (salon.address or "").strip()\n        and salon.location\n    )''',
              '''    return bool(\n        (salon.address or "").strip()\n        and salon.location\n    )''',
          )

          replace_once(
              "templates/dashboards/salon_profile_creator_step2.html",
              '>منطقه / ناحیه</label>',
              '>منطقه / ناحیه (اختیاری)</label>',
          )
          replace_once(
              "templates/dashboards/salon_profile_creator_step2.html",
              '>محله</label>',
              '>محله (اختیاری)</label>',
          )
          replace_once(
              "templates/dashboards/salon_profile_creator_step2.html",
              '''        const score = [hasLocation, hasZone, hasNeighborhood, hasAddress, hasPlaque, hasUnit].filter(Boolean).length;\n        const percent = Math.round((score / 6) * 100);\n        const requiredReady = hasLocation && hasAddress && hasPlaque && hasUnit;''',
              '''        const requiredStates = [hasLocation, hasAddress, hasPlaque, hasUnit];\n        const score = requiredStates.filter(Boolean).length;\n        const percent = Math.round((score / requiredStates.length) * 100);\n        const requiredReady = requiredStates.every(Boolean);''',
          )
          replace_once(
              "templates/dashboards/salon_profile_creator_step2.html",
              '"برای کامل شدن مرحله، آدرس را بررسی کن؛ منطقه و محله خودکار ثبت می‌شوند."',
              '"برای کامل شدن مرحله، آدرس را بررسی کن؛ منطقه و محله در صورت شناسایی خودکار نمایش داده می‌شوند و اختیاری هستند."',
          )

          replace_once(
              "static/js/pages/salon_location_step.js",
              '            missingArea ? "warning" : "success",',
              '            "success",',
          )
          replace_once(
              "static/js/pages/salon_location_step.js",
              "              ? '<i class=\"fa-solid fa-triangle-exclamation ml-1\"></i> آدرس دریافت شد، اما منطقه یا محله کامل نبود. پین را کمی جابه‌جا کن یا دوباره تلاش کن.'",
              "              ? '<i class=\"fa-solid fa-check ml-1\"></i> آدرس دریافت شد. منطقه یا محله در این موقعیت تشخیص داده نشد؛ این دو مورد اختیاری هستند و مانع ذخیره نمی‌شوند.'",
          )
          PY
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin libgdal-dev libgeos-dev libsqlite3-mod-spatialite
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run focused regressions
        run: |
          python manage.py test \
            apps.dashboards.test_optional_location_area_fields \
            apps.search.test_onboarding_location_outside_tehran \
            apps.search.test_mapir_proxy_security \
            apps.dashboards.test_onboarding_smoke_fixes \
            apps.dashboards.test_stage2_setup_readiness \
            --settings=loomera.settings.test --noinput -v 2
      - name: Check diff hygiene
        run: git diff --check
      - name: Commit verified production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboards/views.py templates/dashboards/salon_profile_creator_step2.html static/js/pages/salon_location_step.js
          git commit -m "fix: make salon area fields optional in onboarding"
          git push origin HEAD:fix/onboarding-location-area-optional
