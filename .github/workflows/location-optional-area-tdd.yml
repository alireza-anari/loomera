name: Location optional area verification

on:
  push:
    branches:
      - fix/onboarding-location-area-optional

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-only-secret-key-not-for-runtime
      DATABASE_URL: sqlite:///ci.sqlite3
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      ONLINE_PAYMENT_ENABLED: "False"
      MESSAGING_ENABLED: "False"
      MESSAGING_OUTBOUND_ENABLED: "False"
      BALE_BOT_ENABLED: "False"
      SPATIALITE_LIBRARY_PATH: mod_spatialite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin libgdal-dev libgeos-dev libsqlite3-mod-spatialite
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run --settings=loomera.settings.test
      - name: Run focused regressions
        run: |
          python manage.py test \
            apps.dashboards.test_optional_location_area_fields \
            apps.search.test_onboarding_location_outside_tehran \
            apps.search.test_mapir_proxy_security \
            apps.dashboards.test_onboarding_smoke_fixes \
            apps.dashboards.test_stage2_setup_readiness \
            --settings=loomera.settings.test --noinput -v 2
      - name: Run full Django suite
        run: python manage.py test --settings=loomera.settings.test --noinput -v 1
      - name: Diff hygiene against main
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
