{% with current_namespace=request.resolver_match.namespace|default:'' current_url=request.resolver_match.url_name|default:'' %}
<style>
  /* Loomera customer mobile navbar
     Compact glass bar + equal-size modern outline icons + soft active halo */
  .lm-shell-customer-mobile-nav {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 80;
    padding:
      0 14px
      calc(10px + env(safe-area-inset-bottom, 0px));
    background: transparent;
    border: 0;
    pointer-events: none;
  }

  .lm-shell-customer-mobile-nav__inner {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    align-items: center;
    width: min(100%, 430px);
    min-height: 72px;
    margin: 0 auto;
    padding: 8px 10px;
    direction: ltr;

    border: 1px solid rgba(115, 92, 190, 0.10);
    border-radius: 30px;

    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.82) 0%,
        rgba(250, 248, 255, 0.74) 100%
      );

    box-shadow:
      0 18px 42px rgba(46, 42, 60, 0.14),
      0 4px 14px rgba(115, 92, 190, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.92);

    backdrop-filter: blur(22px) saturate(155%);
    -webkit-backdrop-filter: blur(22px) saturate(155%);

    pointer-events: auto;
  }

  .lm-shell-mobile-nav-item {
    position: relative;
    display: grid;
    width: 54px;
    height: 54px;
    place-items: center;
    justify-self: center;

    border-radius: 50%;
    color: #726D83;
    text-decoration: none;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;

    transition:
      transform 180ms ease,
      color 180ms ease,
      background-color 180ms ease,
      box-shadow 180ms ease,
      border-color 180ms ease;
  }

  .lm-shell-mobile-nav-item i {
    position: relative;
    z-index: 1;
    font-size: 1.55rem;
    line-height: 1;

    transition:
      transform 180ms ease,
      color 180ms ease;
  }

  .lm-shell-mobile-nav-item:active {
    transform: scale(0.92);
  }

  .lm-shell-mobile-nav-item:focus-visible {
    outline: 3px solid rgba(115, 92, 190, 0.20);
    outline-offset: 3px;
  }

  /* فقط آیتم واقعاً فعال برجسته می‌شود */
  .lm-shell-mobile-nav-item.is-active,
  .lm-shell-mobile-nav-item[aria-current="page"] {
    color: var(--lm-primary, #735CBE);

    background:
      radial-gradient(
        circle at 50% 44%,
        rgba(255, 255, 255, 0.98) 0 44%,
        rgba(244, 238, 255, 0.96) 100%
      );

    border: 1px solid rgba(115, 92, 190, 0.18);

    box-shadow:
      0 0 0 7px rgba(115, 92, 190, 0.06),
      0 10px 24px rgba(115, 92, 190, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.98);
  }

  .lm-shell-mobile-nav-item.is-active i,
  .lm-shell-mobile-nav-item[aria-current="page"] i {
    transform: translateY(-1px);
    color: var(--lm-primary, #735CBE);
  }

  /* halo مدرن و خیلی ملایم */
  .lm-shell-mobile-nav-item.is-active::before,
  .lm-shell-mobile-nav-item[aria-current="page"]::before {
    content: "";
    position: absolute;
    inset: -10px;
    z-index: -1;
    border-radius: 50%;

    background:
      radial-gradient(
        circle,
        rgba(115, 92, 190, 0.13) 0%,
        rgba(115, 92, 190, 0.05) 45%,
        transparent 72%
      );
  }
  @media (max-width: 1023.98px) {
    body {
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lm-shell-mobile-nav-item,
    .lm-shell-mobile-nav-item i {
      transition: none;
    }
  }
</style>

<nav
  class="lm-shell-customer-mobile-nav lg:hidden"
  data-shell-nav="customer-mobile"
  aria-label="ناوبری اصلی اپ مشتری"
>
  <div class="lm-shell-customer-mobile-nav__inner" role="list">

    {# حساب من #}
    <a
      href="{% url 'accounts:customer_panel' %}"
      role="listitem"
      aria-label="حساب من"
      {% if current_namespace == 'accounts' %}aria-current="page"{% endif %}
      class="lm-shell-mobile-nav-item lm-app-touch-target {% if current_namespace == 'accounts' %}is-active{% endif %}"
    >
      <i class="fa-regular fa-user" aria-hidden="true"></i>
    </a>

    {# مجله #}
    <a
      href="{% url 'articles:magazine_home' %}"
      role="listitem"
      aria-label="مجله"
      {% if current_namespace == 'articles' %}aria-current="page"{% endif %}
      class="lm-shell-mobile-nav-item lm-app-touch-target {% if current_namespace == 'articles' %}is-active{% endif %}"
    >
      <i class="fa-regular fa-rectangle-list" aria-hidden="true"></i>
    </a>

    {# نوبت‌ها #}
    <a
      href="{% url 'orders:appointments' %}"
      role="listitem"
      aria-label="نوبت‌ها"
      {% if current_namespace == 'orders' %}aria-current="page"{% endif %}
      class="lm-shell-mobile-nav-item lm-app-touch-target {% if current_namespace == 'orders' %}is-active{% endif %}"
    >
      <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
    </a>

    {# جستجو #}
    <a
      href="{% url 'search:search_page' %}"
      role="listitem"
      aria-label="جستجو"
      {% if current_namespace == 'search' %}aria-current="page"{% endif %}
      class="lm-shell-mobile-nav-item lm-app-touch-target {% if current_namespace == 'search' %}is-active{% endif %}"
    >
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    </a>

    {# خانه #}
    <a
      href="{% url 'salons:show_salons' %}"
      role="listitem"
      aria-label="خانه"
      {% if current_namespace == 'salons' and current_url == 'show_salons' %}aria-current="page"{% endif %}
      class="lm-shell-mobile-nav-item lm-app-touch-target {% if current_namespace == 'salons' and current_url == 'show_salons' %}is-active{% endif %}"
    >
      <i class="fa-solid fa-house" aria-hidden="true"></i>
    </a>

  </div>
</nav>
{% endwith %}
