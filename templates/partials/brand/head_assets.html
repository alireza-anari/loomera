{% load static %}
<meta name="application-name" content="Loomera">
<meta name="apple-mobile-web-app-title" content="Loomera">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FCFBFE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16131F">
<meta name="msapplication-TileColor" content="#735CBE">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{% static 'branding/favicon/favicon.svg' %}" type="image/svg+xml">
<link rel="icon" href="{% static 'branding/favicon/favicon.ico' %}" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'branding/favicon/favicon-16x16.png' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'branding/favicon/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="48x48" href="{% static 'branding/favicon/favicon-48x48.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'branding/favicon/apple-touch-icon.png' %}">
<link rel="mask-icon" href="{% static 'branding/favicon/safari-pinned-tab.svg' %}" color="#735CBE">
<link rel="manifest" href="{% static 'branding/favicon/site.webmanifest' %}">
<meta property="og:site_name" content="Loomera">
<meta property="og:type" content="website">
<meta property="og:locale" content="fa_IR">
<meta property="og:image" content="{% static 'branding/logo/loomera-logo-square.png' %}">
<meta property="og:image:width" content="1254">
<meta property="og:image:height" content="1254">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{% static 'branding/logo/loomera-logo-square.png' %}">
