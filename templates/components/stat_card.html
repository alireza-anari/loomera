<article class="lm-component-card lm-dashboard-metric-card lm-card lm-card--default lm-card--interactive rounded-[28px] border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md" aria-label="{{ title }}: {{ value }}">
  <div class="flex items-start justify-between gap-4">
    <div class="space-y-3">
      <p class="lm-dashboard-metric-label text-xs font-semibold text-slate-500">{{ title }}</p>
      <h3 class="lm-dashboard-metric-value text-2xl font-black tracking-tight text-slate-950">{{ value }}</h3>
      <p class="text-sm leading-6 text-slate-500">{{ meta }}</p>
    </div>

    <span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl {% if tone == 'primary' %}bg-loomera-primarySoft text-loomera-primaryText{% elif tone == 'success' %}bg-emerald-100 text-emerald-700{% else %}bg-slate-100 text-slate-700{% endif %}">
      <i class="{{ icon }} text-lg" aria-hidden="true"></i>
    </span>
  </div>
</article>
