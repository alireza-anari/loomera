<nav class="lm-tab-rail overflow-x-auto pb-1" aria-label="فیلترهای وضعیت رزرو">
  <div class="lm-chip lm-chip--interactive inline-flex min-w-full gap-2 rounded-[24px] border border-slate-200 bg-white p-2 shadow-sm" role="list">
    {% for tab in appointment_management.tabs %}
      <a href="{{ tab.url }}"
         class="lm-chip lm-chip--interactive inline-flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-semibold whitespace-nowrap transition {% if tab.is_active %}bg-loomera-primarySoft text-loomera-primaryText{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}" {% if tab.is_active %}aria-current="page"{% endif %}>
        <span>{{ tab.label }}</span>
        <span class="lm-chip lm-chip--interactive inline-flex min-w-7 items-center justify-center rounded-full px-2 py-1 text-[11px] font-bold {% if tab.is_active %}bg-white text-loomera-primaryText{% else %}bg-slate-100 text-slate-500{% endif %}">{{ tab.count }}</span>
      </a>
    {% endfor %}
  </div>
</nav>
