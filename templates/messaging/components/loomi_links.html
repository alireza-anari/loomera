{% if links %}
<div class="rounded-2xl border border-loomera-borderSoft bg-white p-4" dir="rtl">
  <p class="text-sm font-black text-loomera-textPrimary">از لومی بپرس</p>
  <p class="mt-2 text-xs leading-6 text-loomera-textSecondary">درباره خدمات، قیمت‌ها و مسیر رزرو در پیام‌رسان گفتگو کن.</p>
  <div class="mt-3 flex flex-wrap gap-3">
    {% for link in links %}
      <a href="{{ link.url }}" class="inline-flex min-h-10 items-center rounded-full border border-loomera-borderSoft px-4 py-2 text-sm font-bold text-loomera-primary">گفتگو در {{ link.label }}</a>
    {% endfor %}
  </div>
</div>
{% endif %}
