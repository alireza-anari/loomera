<dialog id="stylist-no-show-decision-dialog"
        class="w-[min(92vw,420px)] rounded-[28px] border border-loomera-borderSoft bg-white p-0 shadow-2xl backdrop:bg-slate-950/40">
  <div class="p-5 sm:p-6" dir="rtl">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <p class="text-[11px] font-black text-orange-600">ثبت عدم حضور</p>
        <h2 class="mt-1 text-lg font-black text-loomera-textPrimary">مشتری نیامد؟</h2>
      </div>
      <button type="button" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-loomera-borderSoft bg-white text-loomera-textMuted" data-no-show-dialog-close aria-label="بستن">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <p class="mt-4 text-sm leading-7 text-loomera-textSecondary">
      اگر مطمئنی مشتری در نوبت حاضر نشده، عدم حضور را همین حالا نهایی کن.
      اگر شرایط مبهم است یا نیاز به پیگیری دارد، پرونده را برای بررسی پشتیبانی بفرست.
    </p>

    <div class="mt-5 grid gap-2">
      <form method="post" data-lm-form-ux="off" data-no-show-confirm-form>
        {% csrf_token %}
        <input type="hidden" name="action" value="no_show_confirm_direct">
        <input type="hidden" name="next" value="" data-no-show-next>
        <button class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-2xl bg-rose-600 px-4 py-3 text-sm font-black text-white">
          <i class="fa-solid fa-user-xmark" aria-hidden="true"></i>
          <span>تأیید عدم حضور</span>
        </button>
      </form>

      <form method="post" data-lm-form-ux="off" data-no-show-review-form>
        {% csrf_token %}
        <input type="hidden" name="action" value="no_show_review">
        <input type="hidden" name="next" value="" data-no-show-next>
        <button class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-2xl border border-loomera-borderSoft bg-white px-4 py-3 text-sm font-black text-loomera-textSecondary">
          <i class="fa-solid fa-headset" aria-hidden="true"></i>
          <span>نیاز به بررسی</span>
        </button>
      </form>

      <button type="button" class="min-h-10 text-xs font-black text-loomera-textMuted" data-no-show-dialog-close>انصراف</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  const dialog = document.getElementById('stylist-no-show-decision-dialog');
  if (!dialog || dialog.dataset.bound === 'true') return;
  dialog.dataset.bound = 'true';

  const confirmForm = dialog.querySelector('[data-no-show-confirm-form]');
  const reviewForm = dialog.querySelector('[data-no-show-review-form]');
  const nextInputs = dialog.querySelectorAll('[data-no-show-next]');

  document.addEventListener('click', (event) => {
    const trigger = event.target.closest('[data-no-show-decision-open]');
    if (!trigger) return;

    const actionUrl = trigger.dataset.actionUrl || window.location.pathname;
    const nextUrl = trigger.dataset.next || window.location.pathname;
    confirmForm.action = actionUrl;
    reviewForm.action = actionUrl;
    nextInputs.forEach((input) => { input.value = nextUrl; });

    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', 'open');
  });

  dialog.querySelectorAll('[data-no-show-dialog-close]').forEach((button) => {
    button.addEventListener('click', () => dialog.close());
  });

  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) dialog.close();
  });
})();
</script>
