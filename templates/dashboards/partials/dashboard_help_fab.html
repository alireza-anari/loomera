{% load static %}

<link rel="stylesheet" href="{% static 'css/components/help_assistant.css' %}?v=20260827-13">
<div
  class="lm-help-assistant"
  data-help-assistant
  data-context-url="{% url 'help_center:context_api' %}"
  data-chat-url="{% url 'help_center:chat_api' %}"
  data-customer-discovery-url="{% url 'help_center:customer_discovery_api' %}"
  data-conversation-url="{% url 'help_center:conversation_api' %}"
  data-feedback-url="{% url 'help_center:feedback_api' %}"
  data-handoff-url="{% url 'help_center:support_handoff_api' %}"
  data-help-url="{% url 'help_center:home' %}"
  data-support-url="{% url 'support' %}"
  data-current-path="{{ request.path|default:'/' }}"
  data-current-route="{{ request.resolver_match.view_name|default:'' }}"
>
  <div hidden>{% csrf_token %}</div>

  <button
    type="button"
    class="lm-help-assistant__fab"
    data-help-fab
    aria-label="باز کردن لومی"
    aria-expanded="false"
  >
    <span class="lm-help-assistant__fab-icon" aria-hidden="true">
      <i class="fa-regular fa-message"></i>
    </span>
    <span class="lm-help-assistant__fab-badge" data-help-new-dot aria-hidden="true"></span>
  </button>

  <section
    class="lm-help-assistant__panel"
    data-help-panel
    hidden
    role="dialog"
    aria-label="لومی، دستیار راهنمای لومرا"
  >
    <header class="lm-help-assistant__header">
      <div class="lm-help-assistant__identity">
        <span class="lm-help-assistant__avatar" aria-hidden="true">
          <i class="fa-solid fa-sparkles"></i>
        </span>
        <div class="lm-help-assistant__identity-copy">
          <strong>لومی</strong>
          <small data-help-page-label>
            <span class="lm-help-assistant__online-dot"></span>
            دستیار راهنمای لومرا
          </small>
        </div>
      </div>

      <div class="lm-help-assistant__header-actions">
        <button type="button" data-help-new-chat title="گفتگوی جدید" aria-label="شروع گفتگوی جدید">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button type="button" data-help-close title="بستن" aria-label="بستن">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </header>

    <div class="lm-help-assistant__messages" data-help-messages aria-live="polite">
      <div class="lm-help-assistant__welcome" data-help-welcome>
        <div class="lm-help-assistant__welcome-message">
          <span class="lm-help-assistant__welcome-avatar" aria-hidden="true">
            <i class="fa-solid fa-sparkles"></i>
          </span>
          <div>
            <strong>سلام، من لومی‌ام.</strong>
            <p data-help-context-summary>چه کاری می‌خوای انجام بدی؟</p>
          </div>
        </div>
        <div class="lm-help-assistant__prompts" data-help-prompts></div>
      </div>
    </div>

    <div class="lm-help-assistant__handoff" data-help-handoff-box hidden>
      <button type="button" data-help-escalate>
        <i class="fa-solid fa-headset" aria-hidden="true"></i>
        ارجاع به پشتیبانی
      </button>
    </div>

    <form class="lm-help-assistant__composer" data-help-form>
      <div class="lm-help-assistant__input-shell">
        <textarea
          rows="1"
          maxlength="1200"
          data-help-input
          placeholder="پیامت رو بنویس..."
          aria-label="پیام به لومی"
        ></textarea>
        <button type="submit" data-help-send aria-label="ارسال پیام">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </form>
  </section>
</div>

<script type="module" src="{% static 'js/components/help_assistant.js' %}?v=20260827-13"></script>
