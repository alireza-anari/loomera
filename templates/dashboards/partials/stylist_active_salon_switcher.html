{% if stylist_active_memberships and stylist_active_memberships|length > 1 %}
  <section class="mb-5 rounded-[28px] border border-loomera-primary/15 bg-white/95 p-4 shadow-lm-soft sm:p-5" aria-label="انتخاب مجموعه فعال متخصص">
    <form method="post" action="{% url 'dashboards:set_stylist_active_salon' %}" class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path|default:request.path }}">
      <div class="min-w-0">
        <p class="text-[11px] font-black text-loomera-primaryText">زمینه کاری فعال</p>
        <h2 class="mt-1 text-base font-black text-loomera-textPrimary sm:text-lg">داشبورد این متخصص برای کدام مجموعه نمایش داده شود؟</h2>
        <p class="mt-1 text-xs leading-6 text-loomera-textMuted">برای متخصص چندمجموعهی، نوبت‌ها، مالی و برنامه کاری بر اساس مجموعه انتخاب‌شده فیلتر می‌شوند.</p>
      </div>
      <div class="flex min-w-0 flex-col gap-2 sm:flex-row sm:items-center">
        <select name="salon_id" class="min-h-12 min-w-0 rounded-2xl border border-loomera-borderSoft bg-white px-4 py-3 text-sm font-bold text-loomera-textPrimary outline-none transition focus:border-loomera-primary/40 focus:ring-4 focus:ring-loomera-primary/10">
          {% for membership in stylist_active_memberships %}
            <option value="{{ membership.salon_id }}" {% if stylist_salon and membership.salon_id == stylist_salon.id %}selected{% endif %}>{{ membership.salon.salon_name }}</option>
          {% endfor %}
        </select>
        <button type="submit" class="inline-flex min-h-12 shrink-0 items-center justify-center gap-2 rounded-2xl bg-loomera-primary px-5 py-3 text-sm font-black text-white shadow-[0_18px_38px_rgba(115,92,190,0.20)] transition hover:-translate-y-0.5 hover:opacity-95">
          <i class="fa-solid fa-arrows-rotate text-xs" aria-hidden="true"></i>
          <span>تغییر مجموعه فعال</span>
        </button>
      </div>
    </form>
  </section>
{% endif %}
