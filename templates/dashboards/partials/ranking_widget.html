{% if widget.items %}
  <div class="space-y-3" role="list">
    {% for item in widget.items %}
      <article role="listitem" class="flex items-center justify-between gap-4 rounded-[24px] border border-loomera-borderSoft bg-loomera-bgSubtle px-4 py-4 transition hover:border-loomera-primary/20 hover:bg-white">
        <div class="flex min-w-0 items-center gap-3">
          <span class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-white text-sm font-black text-loomera-primaryText shadow-lm-soft">
            {{ forloop.counter }}
          </span>
          <div class="min-w-0">
            <h3 class="truncate text-sm font-black text-loomera-textPrimary">{{ item.title }}</h3>
            <p class="mt-1 truncate text-xs text-loomera-textMuted">{{ item.meta }}</p>
          </div>
        </div>
        <div class="shrink-0 text-left text-sm font-black text-loomera-textPrimary">{{ item.value }}</div>
      </article>
    {% endfor %}
  </div>
{% else %}
  <div class="rounded-[24px] border border-dashed border-loomera-borderSoft bg-loomera-bgSubtle p-5 text-center" role="status">
    <span class="mx-auto inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-white text-loomera-primaryText shadow-lm-soft">
      <i class="{{ empty_icon }} text-base" aria-hidden="true"></i>
    </span>
    <h3 class="mt-4 text-sm font-black text-loomera-textPrimary">{{ empty_title }}</h3>
    <p class="mt-2 text-xs leading-6 text-loomera-textMuted">{{ empty_description }}</p>
  </div>
{% endif %}
