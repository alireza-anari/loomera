{% if is_available and url != '#' %}
  <a href="{{ url }}" class="lm-component-card lm-component-card--interactive lm-card lm-card--interactive lm-card--default group block rounded-[28px] border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-loomera-primary/20 hover:shadow-md" aria-label="مشاهده {{ title }}">
{% else %}
  <div class="lm-component-card lm-card lm-card--default lm-card--disabled group rounded-[28px] border border-slate-200 bg-white p-5 shadow-sm opacity-70" aria-disabled="true">
{% endif %}
    <div class="flex items-start justify-between gap-4">
      <span class="lm-component-icon-surface inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-loomera-primarySoft text-loomera-primaryText">
        <i class="{{ icon }} text-lg" aria-hidden="true"></i>
      </span>
      <span class="lm-badge lm-badge--neutral rounded-full bg-slate-100 px-3 py-1 text-[11px] font-bold text-slate-600">{{ badge }}</span>
    </div>

    <div class="mt-5">
      <h3 class="text-base font-black text-slate-950">{{ title }}</h3>
      <p class="mt-2 text-sm leading-7 text-slate-500">{{ description }}</p>
    </div>

    <div class="mt-5 flex items-center justify-between text-sm font-semibold {% if is_available and url != '#' %}text-loomera-primaryText{% else %}text-slate-400{% endif %}">
      <span>{% if is_available and url != '#' %}مشاهده بخش{% else %}به‌زودی{% endif %}</span>
      <i class="fa-solid fa-arrow-left lm-arrow-rtl text-xs" aria-hidden="true"></i>
    </div>
{% if is_available and url != '#' %}
  </a>
{% else %}
  </div>
{% endif %}
