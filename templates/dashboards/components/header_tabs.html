<nav class="overflow-x-auto pb-1" aria-label="فیلترهای وضعیت رزرو">
  <div class="inline-flex min-w-full gap-2 rounded-[24px] border border-loomera-borderSoft bg-white/95 p-2 shadow-lm-soft" role="list">
    {% for tab in appointment_management.tabs %}
      <a href="{{ tab.url }}"
         data-appointments-ajax-link
         class="inline-flex shrink-0 items-center gap-3 rounded-2xl px-4 py-3 text-sm font-black transition {% if tab.is_active %}border border-loomera-primary/20 bg-loomera-primarySoft text-loomera-primaryText shadow-sm{% else %}text-loomera-textSecondary hover:bg-loomera-primarySoft/60 hover:text-loomera-primary{% endif %}"
         {% if tab.is_active %}aria-current="page"{% endif %}>
        <span>{{ tab.label }}</span>
        <span class="inline-flex min-w-7 items-center justify-center rounded-full px-2 py-1 text-[11px] font-black {% if tab.is_active %}bg-white/80 text-loomera-primaryText{% else %}bg-loomera-bgSubtle text-loomera-textMuted{% endif %}">{{ tab.count }}</span>
      </a>
    {% endfor %}
  </div>
</nav>
