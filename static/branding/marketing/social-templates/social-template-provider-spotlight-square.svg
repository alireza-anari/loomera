<text x="484" y="571" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="23" font-weight="600" fill="#57526E" text-anchor="end">تجربه و تخصص قابل‌بررسی</text>
<text x="484" y="649" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="23" font-weight="600" fill="#57526E" text-anchor="end">لحن حرفه‌ای و آرام</text>
<rect x="128" y="716" width="776" height="136" rx="32" fill="#F8F5FE"/>
<text x="856" y="790" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="25" fill="#57526E" text-anchor="end">این قالب باید human trust بسازد؛ نه glamour. از retouch سنگین و visual cliché پرهیز کنید.</text>
