<g id="placeholder"><rect x="592" y="216" width="312" height="420" rx="38" fill="#F8F5FE" stroke="#DDD8E8" stroke-dasharray="10 10"/><text x="748.0" y="426.0" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="28" font-weight="500" fill="#7A738F" text-anchor="middle">جای عکس متخصص / Provider Photo</text></g>
<text x="516" y="320" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="28" font-weight="600" fill="#A7C8A1" text-anchor="end">معرفی متخصص</text>
<text x="516" y="396" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="54" font-weight="650" fill="#2E2A3C" text-anchor="end">نام متخصص</text>
