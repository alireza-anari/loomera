<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <title>social-template-story-brand</title>
  <desc>Loomera social media template - editable SVG</desc>
  <defs>
    <linearGradient id="gradV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2ECFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="gradStory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F5FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    
  </defs>
  
<rect width="1080" height="1920" fill="url(#gradStory)"/>
<circle cx="850" cy="340" r="220" fill="#F8F5FE"/>
<circle cx="920" cy="280" r="108" fill="#9B80E0" opacity="0.22"/>
<g id="logo-slot"><rect x="852" y="120" width="138" height="34" rx="10" fill="none" stroke="#DDD8E8" stroke-dasharray="6 6"/><text x="921.0" y="143" font-family="Inter, sans-serif" font-size="15" fill="#7A738F" text-anchor="middle">LOGO</text></g>
<g id="badge"><rect x="72" y="120" width="166" height="40" rx="18" fill="#FFFFFF" stroke="#DDD8E8"/><text x="220" y="146" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="18" font-weight="600" fill="#57526E" text-anchor="end">Story / Brand</text></g>
<text x="1008" y="478" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="78" font-weight="650" fill="#2E2A3C" text-anchor="end">آرام‌تر انتخاب کنید</text>
<text x="1008" y="572" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="78" font-weight="650" fill="#2E2A3C" text-anchor="end">روشن‌تر رزرو کنید</text>
