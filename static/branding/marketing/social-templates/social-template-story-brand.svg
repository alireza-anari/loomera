<g id="cta"><rect x="72" y="1606" width="198" height="54" rx="27" fill="#735CBE"/><text x="171.0" y="1641" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">آشنایی بیشتر</text></g>

