<rect x="128" y="244" width="824" height="480" rx="42" fill="#F8F5FE"/>
<text x="904" y="370" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="42" font-weight="650" fill="#2E2A3C" text-anchor="end">«تجربه‌ی رزرو روشن‌تر بود و
