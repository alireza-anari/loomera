<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <title>social-template-carousel-cover</title>
  <desc>Loomera social media template - editable SVG</desc>
  <defs>
    <linearGradient id="gradV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2ECFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="gradStory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F5FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    
  </defs>
  
<rect width="1080" height="1350" fill="url(#gradV)"/>
<circle cx="902" cy="180" r="168" fill="#F8F5FE"/>
<g id="badge"><rect x="84" y="86" width="176" height="40" rx="18" fill="#FFFFFF" stroke="#DDD8E8"/><text x="242" y="112" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="18" font-weight="600" fill="#57526E" text-anchor="end">Carousel Cover</text></g>
