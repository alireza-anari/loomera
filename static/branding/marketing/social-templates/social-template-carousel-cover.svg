<text x="948" y="814" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="28" font-weight="600" fill="#2E2A3C" text-anchor="end">این قاب می‌تواند artwork-led، photo-led یا text-led باشد.</text>
<text x="948" y="874" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="26" fill="#57526E" text-anchor="end">عدد اسلاید یا cue موضوعی اختیاری اما مفید است.</text>
