<text x="996" y="360" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="74" font-weight="650" fill="#2E2A3C" text-anchor="end">سه نکته برای انتخاب</text>
<text x="996" y="448" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="74" font-weight="650" fill="#2E2A3C" text-anchor="end">خدمت مناسب‌تر</text>
<text x="996" y="558" direction="rtl" font-family="Vazirmatn, Yekan Bakh, Inter, sans-serif" font-size="32" fill="#57526E" text-anchor="end">کاور carousel باید hook روشن و promise قابل‌اسکن داشته باشد.</text>
